apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: vllm
  labels:
    app: gateway
  annotations:
    # AWS Load Balancer Controller annotations
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    # TLS termination at the NLB (requires ACM cert in the same region as the cluster).
    # deploy.sh substitutes PLACEHOLDER_ACM_CERT_ARN from ACM_CERT_ARN in .env
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "PLACEHOLDER_ACM_CERT_ARN"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
