apiVersion: v1
kind: Secret
metadata:
  name: vllm-secrets
  namespace: vllm
  labels:
    app: vllm
type: Opaque
stringData:
  # ============================================
  # HuggingFace Token (REQUIRED for Llama 3.1)
  # ============================================
  # Llama 3.1 is a gated model - you MUST provide a valid token!
  #
  # Steps:
  # 1. Visit https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
  # 2. Accept the Llama 3.1 Community License Agreement
  # 3. Get your token at: https://huggingface.co/settings/tokens
  # 4. Set HF_TOKEN in your .env file (see .env.example)
  #
  # For public models like Qwen, leave HF_TOKEN empty in .env
  HF_TOKEN: "PLACEHOLDER_HF_TOKEN"

  # ============================================
  # API Key for Authentication
  # ============================================
  # All API requests must include this key in the Authorization header:
  #   Authorization: Bearer your-api-key-here
  #
  # Generate a strong key with: openssl rand -hex 32
  # Set VLLM_API_KEY in your .env file (see .env.example)
  VLLM_API_KEY: "PLACEHOLDER_VLLM_API_KEY"

  # ============================================
  # OpenAI API key (optional — input guard + query rewrite)
  # ============================================
  # Used by gpt-4o-mini for ALLOW/REFUSE classification and conversational
  # query rewrite. Leave empty to skip both (fail-open / literal search query).
  # Set OPENAI_API_KEY in .env (see .env.example).
  OPENAI_API_KEY: "PLACEHOLDER_OPENAI_API_KEY"
