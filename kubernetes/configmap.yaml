apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: vllm
  labels:
    app: vllm
data:
  # ============================================
  # Model Configuration - EDIT THESE VALUES
  # ============================================

  # HuggingFace model name
  # Examples:
  #   - meta-llama/Llama-3.1-8B-Instruct (default, requires HF token)
  #   - meta-llama/Llama-3.1-70B-Instruct (requires HF token)
  #   - Qwen/Qwen2.5-7B-Instruct (no token needed)
  #   - mistralai/Mistral-7B-Instruct-v0.2
  MODEL_NAME: "meta-llama/Llama-3.1-8B-Instruct"

  # Maximum sequence length (context window)
  # Lower values use less GPU memory
  # Llama 3.1 supports up to 128K, but limit based on your GPU
  MAX_MODEL_LEN: "4096"

  # GPU memory utilization (0.0 to 1.0)
  # Higher values allow more tokens but risk OOM
  GPU_MEMORY_UTILIZATION: "0.9"

  # Server configuration
  HOST: "0.0.0.0"
  PORT: "8000"
